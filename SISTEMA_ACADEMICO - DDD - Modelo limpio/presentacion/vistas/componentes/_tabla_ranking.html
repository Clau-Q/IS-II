<div class="table-wrap"><table><tr><th>Posición</th><th>Estudiante</th><th>Puntaje</th><th>Porcentaje</th></tr>{% for r in ranking %}<tr><td>{{ r.posicion }}</td><td>{{ r.codigo_estudiante }} · {{ r.estudiante }}</td><td>{{ r.puntaje }}</td><td>{{ '%.2f'|format(r.porcentaje) }} %</td></tr>{% else %}<tr><td colspan="4">No hay resultados publicados.</td></tr>{% endfor %}</table></div>
