<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión</title><link rel="stylesheet" href="{{ url_for('static', filename='estilos_sistema.css') }}"></head>
<body class="login-page"><main class="login-card"><h1>Sistema de Examen de<br>Admisión</h1><p>Ingrese sus credenciales para continuar</p>
{% for categoria, mensaje in get_flashed_messages(with_categories=true) %}<div class="mensaje-error" role="alert">{{ mensaje }}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field">Usuario<input name="usuario" autocomplete="username" required></label><label class="field">Contraseña<input name="contrasena" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">↪ &nbsp; Iniciar sesión</button></form></main></body></html>
