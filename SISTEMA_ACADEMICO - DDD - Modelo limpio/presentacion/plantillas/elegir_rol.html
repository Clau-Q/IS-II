<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Elegir perfil</title><link rel="stylesheet" href="{{ url_for('static', filename='estilos_sistema.css') }}"></head><body class="login-page"><main class="login-card"><h1>Selecciona tu perfil</h1><p>Elige el panel al que deseas ingresar.</p>{% for rol in roles %}<p><a class="btn" href="{{ url_for(rol|lower) }}">{{ rol|capitalize }}</a></p>{% endfor %}<form method="post" action="{{ url_for('salir') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn light" type="submit">Salir</button></form></main></body></html>
